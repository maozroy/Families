<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<!-- v1 pinned maximum-scale=1 and user-scalable=no to keep pinch gestures for
     Leaflet. It does not need them: Leaflet handles its own pinch inside #map,
     and the page around it has nothing to zoom away. What the pin actually cost
     was every reader who enlarges text to read it — in a family whose oldest
     members are the reason this tree exists. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="x-build" content="">
<script>
/* Is this document still the current one?
 *
 * The service worker means a relative can be running a copy of this page that
 * was cached days ago — and a cached document that is BROKEN is the one state
 * the app cannot get itself out of: every reload serves the same stale copy,
 * and nothing on screen can say so. That is not hypothetical; it cost an
 * afternoon on 2026-08-14, with the fix live on the server the whole time and a
 * phone that could not reach it.
 *
 * So: the server stamps each document with a hash of itself on the way out, and
 * /api/build says what the current stamps are. /api/* is network-only in the
 * worker, so that answer can never itself be stale. A mismatch means this page
 * is not the page the server is serving, and the only honest thing to do is
 * throw away everything cached and come back.
 *
 * Three things keep this from being worse than the problem:
 *
 *  - **It reloads at most once per stamp**, remembered in sessionStorage. A
 *    reload loop on a page the family cannot reach any other way would be a far
 *    worse bug than a stale page.
 *  - **The SERVER's answer decides, not ours.** A blank stamp used to mean "do
 *    nothing", and that was backwards: on this site the only thing that serves
 *    an unstamped document is the worker replaying a copy cached before the
 *    placeholder existed — which is precisely the stuck phone this exists for,
 *    and it was the one case the check excused. What keeps a dev file server
 *    safe is not the blank stamp, it is that nothing there answers /api/build
 *    with a stamp to disagree with.
 *  - **It fails silent.** No network, no /api/build, no storage: nothing
 *    happens. This is a repair path, not a gate.
 */
(function () {
  var el = document.querySelector('meta[name="x-build"]');
  if (!el) return;
  var mine = el.getAttribute('content') || '';
  var which = /\/tree|\/index|\/v2\/tree/.test(location.pathname) ? 'tree' : 'map';
  fetch('/api/build', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    var now = j && j[which];
    if (!now || now === mine) return;
    var key = 'fam.staleReload';
    try { if (sessionStorage.getItem(key) === now) return; sessionStorage.setItem(key, now); } catch (e) { return; }
    var done = function () { location.reload(); };
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
    }));
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    }));
    Promise.all(jobs).then(done, done);
  }).catch(function () {});
}());
</script>

:root {
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f9f4ed;
  --color-neutral-200: #eee7db;
  --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5;
  --color-neutral-500: #a19786;
  --color-neutral-600: #82796a;
  --color-neutral-700: #645c50;
  --color-neutral-800: #474238;
  --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb;
  --color-accent-200: #ffe1d0;
  --color-accent-300: #ffc6a5;
  --color-accent-400: #f6a06b;
  --color-accent-500: #d67f48;
  --color-accent-600: #b2622d;
  --color-accent-700: #8c491a;
  --color-accent-800: #643312;
  --color-accent-900: #402310;

  --color-accent-2-100: #f0fae1;
  --color-accent-2-200: #e1eecc;
  --color-accent-2-300: #ccdbb2;
  --color-accent-2-400: #aebf92;
  --color-accent-2-500: #8fa073;
  --color-accent-2-600: #728157;
  --color-accent-2-700: #56633f;
  --color-accent-2-800: #3d472b;
  --color-accent-2-900: #272e1b;

  --font-heading: "Caprasimo", "Roobert Hebrew", system-ui, sans-serif;
  --font-heading-weight: 400;
  --font-body: "Roobert Hebrew", "Figtree", system-ui, sans-serif;

  --space-1: 4.4px;
  --space-2: 8.8px;
  --space-3: 13.2px;
  --space-4: 17.6px;
  --space-6: 26.4px;
  --space-8: 35.2px;

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 28px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }

<script>
  /* Direction before first paint, same as the tree: flipping rtl→ltr after the
     map has drawn moves every control across the screen. */
  (function () {
    try {
      var v = localStorage.getItem('familyLang');
      if (v !== 'he' && v !== 'en') v = null;
      var l = v || ((navigator.language || '').match(/^(he|iw)/i) ? 'he' : 'en');
      document.documentElement.setAttribute('lang', l);
      document.documentElement.setAttribute('dir', l === 'he' ? 'rtl' : 'ltr');
    } catch (e) {}
  })();

  /* An expired session comes back as 401 JSON, never as a login page. Reloading
     turns it back into a document request, which the server redirects into the
     sign-in flow. Guarded so a server that 401s the document cannot spin. */
  (function () {
    var f = window.fetch;
    if (!f) return;
    var bounced = false;
    window.fetch = function () {
      return f.apply(this, arguments).then(function (r) {
        if (r && r.status === 401 && !bounced) { bounced = true; location.reload(); }
        return r;
      });
    };
  })();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   v2 — the map, on a phone.
   ═══════════════════════════════════════════════════════════════════════════

   Measured on a 390×844 screen, opening one person's card put SIX floating
   surfaces on the map at once: a title card, a search bar, a language bar, the
   details panel, the zoom buttons and the legend — plus Leaflet's attribution
   underneath the legend. The panel covered about 78% of the map and, worst of
   all, covered the pin it was describing.

   Three moves fix it, and they are all the same move: give each thing one place
   and let the map have the rest.

     1. one bar, not three
     2. the card is a bottom sheet, and the map moves the pin above it
     3. the legend gets out of the way when the card is up             */

/* ── one bar ────────────────────────────────────────────────────────────────
   The title card ("The family on the map / 323 of 380 have a place to live")
   was a permanent 200px band at the top of a phone to say a number that belongs
   in the legend. It goes there. What is left — the segmented Tree|Map, the
   search, the two filters, copy-link, language — is one wrapping bar. */
@media (max-width: 760px) {
  #topbar {
    top: calc(var(--space-2) + var(--safe-t)) !important;
    inset-inline-start: calc(var(--space-2) + var(--safe-l)) !important;
    inset-inline-end: calc(var(--space-2) + var(--safe-r)) !important;
    gap: var(--space-2) !important;
  }
  #titleBar { display: none !important; }
  /* Search and its two filter buttons take a row of their own and all of the
     width: v1 gave the field 150px, which is why its placeholder rendered as
     "Find a person or pla". */
  .bar.search-wrap { order: 2; flex: 1 1 100%; }
  .search-input { width: auto !important; flex: 1 1 auto; min-width: 0; }
  .bar.tools { order: 1; flex: 0 1 auto; min-width: 0; }
  #topbar > .spacer { display: none; }
  /* The fit button keeps its icon and drops its words, the same trade the two
     filter buttons already make at this width. */
  #fit .fit-label { display: none; }
  #fit { padding: 0 12px !important; }
}
@media (min-width: 761px) { #fit .fit-icon { display: none; } }

/* ── the card as a bottom sheet ─────────────────────────────────────────────
   Docked to the bottom edge, full width, with the same grip the tree page uses.
   `--sheet-h` is written from JS during a drag; the stops are the same three
   ideas (peek / half / full). */
@media (max-width: 760px) {
  .sheet {
    inset-inline: 0 !important;
    inset-block-start: auto !important;
    bottom: 0 !important;
    width: auto !important;
    max-height: none !important;
    height: var(--sheet-h, 42dvh);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding-bottom: calc(var(--space-3) + var(--safe-b));
    transition: height .26s cubic-bezier(.22, .61, .36, 1);
  }
  .sheet.dragging { transition: none; }
  .sheet-grip {
    display: flex; align-items: center; justify-content: center;
    flex: none; height: 30px; margin: -8px 0 0;
    background: none; border: 0; padding: 0; cursor: grab; touch-action: none;
  }
  .sheet-grip::before {
    content: ''; width: 40px; height: 5px; border-radius: 999px;
    background: var(--color-neutral-400);
  }
  /* The legend and the card both want the bottom of the screen, and on a phone
     the card covers that corner completely. Rather than leave the legend
     underneath where it cannot be read or tapped, it goes away while a card is
     open and comes back when the card closes — v1 left the two overlapping. */
  body.has-sheet .legend-box { display: none !important; }
  /* Leaflet's attribution shared the same corner as the legend. It rides above
     the sheet rather than being hidden by it: the OSM tile licence requires the
     credit to be visible, and "visible unless you tapped something" is not that.
     `--sheet-h` is written by placeSheet() on every drag and snap. */
  .leaflet-control-attribution {
    max-width: 78vw; font-size: 11px;
    margin-bottom: var(--safe-b) !important;
    transition: margin-bottom .26s cubic-bezier(.22, .61, .36, 1);
  }
  body.has-sheet .leaflet-control-attribution {
    margin-bottom: calc(var(--sheet-h, 42dvh) + 4px) !important;
  }
}
@media (min-width: 761px) { .sheet-grip { display: none; } }

/* ── the legend ─────────────────────────────────────────────────────────────
   v1 showed 8 of 14 families and cut the rest off, because a five-line block of
   instructions was pinned below the list inside a fixed-height box. The prose
   moves behind an ⓘ and the list gets the room back. */
.legend-box { padding-bottom: calc(var(--space-3) + var(--safe-b)); }
@media (max-width: 760px) {
  .legend-box {
    inset-inline-end: calc(var(--space-2) + var(--safe-r));
    bottom: calc(var(--space-2) + var(--safe-b));
    max-height: min(64dvh, 560px);
    width: min(300px, calc(100vw - 2 * var(--space-2)));
    transition: max-height .2s, opacity .2s;
  }
}
.legend-foot[hidden] { display: none !important; }
.legend-info {
  width: 26px; height: 26px; flex: none; border-radius: 999px;
  border: 1px solid var(--color-divider); background: var(--color-neutral-100);
  color: color-mix(in srgb, var(--color-text) 62%, transparent);
  font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  display: grid; place-items: center; padding: 0;
}
.legend-info[aria-expanded="true"] { background: var(--color-accent-100);
  border-color: var(--color-accent); color: var(--color-accent-900); }
/* The head is a row of three now (title, ⓘ, show-all) and needs to wrap rather
   than squeeze the title to nothing. */
.legend-head { flex-wrap: wrap; row-gap: 4px; }

/* ── the fit button ─────────────────────────────────────────────────────────
   "מרכז על ישראל" / "Israel" was a filled accent pill — the loudest control on
   the page — for a zoom reset, while the two filters that actually change what
   you are looking at were quiet outlines. They swap roles. */
#fit { background: var(--color-neutral-100) !important; color: var(--color-text) !important;
  border: 1px solid var(--color-divider) !important; box-shadow: none !important;
  font-weight: 500 !important; }
#fit:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent) !important; }

/* ── zoom buttons ───────────────────────────────────────────────────────────
   30×30 targets on a touch screen, for a gesture the screen already has. A
   coarse pointer means fingers, and fingers pinch. */
@media (pointer: coarse) { .leaflet-control-zoom { display: none !important; } }

/* Icon-only at this width, so it needs a width floor as well as a height one —
   the shared rule in v2-base.css only sets height, because forcing a width on a
   text button would stretch "Back" into a square. */
@media (max-width: 760px) { #fit { min-width: var(--tap); justify-content: center; } }

/* The labels under the pins and the cluster breakdown — the numbers a reader is
   actually here to read — were 11px over a busy map. */
.cluster-tag, .pin-label { font-size: 12px !important; }
@media (pointer: fine) { .leaflet-control-zoom a { width: 34px !important; height: 34px !important; line-height: 34px !important; } }

/* ── the map itself in the dark ─────────────────────────────────────────────
   OSM's raster tiles are drawn for a white page and there is no dark variant on
   this tile server. Inverting hue-rotated is the standard trick and it holds up:
   roads stay lighter than blocks, water stays distinct, and the family's pins —
   which are drawn by us, not by the tile — are excluded so they keep the exact
   colour the family chose. */
@media (prefers-color-scheme: dark) {
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.94) contrast(.92); }
  .leaflet-control-attribution { background: rgba(20, 18, 13, .8) !important; color: #b5ad94 !important; }
  .leaflet-control-attribution a { color: #d5ceb8 !important; }
}
</style>
</head>
<body>
<div id="map"></div>

<!-- Above the details panel and the legend, not beside them: the search list
     drops out of this bar and is long enough to reach both. z-index on the
     option itself cannot win that — the bar is its stacking context. -->
<div id="topbar" style="position: absolute; z-index: 560; top: var(--space-3); inset-inline-start: var(--space-3); inset-inline-end: var(--space-3); display: flex; gap: var(--space-2); align-items: flex-start; flex-wrap: wrap; pointer-events: none">
  <div id="titleBar" class="bar">
    <div style="min-width: 0; padding-inline-start: 6px">
      <div id="title" style="font-family: var(--font-heading); font-size: 17px; line-height: 1.1"></div>
      <div id="count" style="font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent)"></div>
    </div>
  </div>


  <!-- The filters live beside the search because that is where somebody goes to
       narrow the map down. They were rows inside the legend at the bottom of
       the screen, which is where a legend belongs and where a control does not:
       nobody found them. -->
  <div class="bar search-wrap">
    <input id="q" class="search-input" type="text" autocomplete="off" spellcheck="false"
           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="qlist">
    <div id="qlist" class="search-list" role="listbox" hidden></div>

    <div class="filter-wrap">
      <button id="famBtn" class="filter-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="famMenu">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8Z"></path></svg>
        <span class="lbl"></span><span class="cnt"></span>
      </button>
      <div id="famMenu" class="filter-menu" role="group" hidden></div>
    </div>

    <div class="filter-wrap">
      <button id="orgBtn" class="filter-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="orgMenu">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z"></path></svg>
        <span class="lbl"></span><span class="cnt"></span>
      </button>
      <div id="orgMenu" class="filter-menu" role="group" hidden></div>
    </div>
  </div>

  <div class="spacer" style="flex: 1; min-width: 0"></div>

  <!-- One bar, not two. v1 kept the Tree|Map control in its own pill beside the
       title card and these three in another, which on a phone wrapped to two
       separate rows — and with the search that made three bands of furniture
       stacked over the map before anything else was on screen. They pay for one
       pill's padding between them now and fit on one row. -->
  <div class="bar tools">
    <nav class="nav-seg">
      <a id="toTree" href="/tree">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V9"></path><path d="M5 22v-5a7 7 0 0 1 7-7"></path><path d="M19 22v-5a7 7 0 0 0-7-7"></path><circle cx="12" cy="5" r="3"></circle></svg>
        <span></span>
      </a>
      <span class="on" aria-current="page">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <span id="tabMap"></span>
      </span>
    </nav>
    <button id="copy" class="icon-btn" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19"></path></svg>
    </button>
    <button id="lang" class="icon-btn" type="button" style="width: auto; padding: 0 12px"></button>
    <!-- Was `btn-primary` — a filled accent pill, the loudest thing on the map,
         for a zoom reset. It is a secondary control now, and on a phone it drops
         its label to an icon; see the note in the stylesheet. -->
    <button id="fit" class="btn btn-secondary" type="button" style="border-radius: 999px; white-space: nowrap; flex: none">
      <svg class="fit-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3"></path><path d="M16 3h3a2 2 0 0 1 2 2v3"></path><path d="M21 16v3a2 2 0 0 1-2 2h-3"></path><path d="M8 21H5a2 2 0 0 1-2-2v-3"></path></svg>
      <span class="fit-label">מרכז על ישראל</span>
    </button>
  </div>
</div>

<div class="legend-box">
  <div class="legend-head">
    <button id="legendToggle" class="grow" type="button" aria-expanded="true" aria-controls="legend">
      <svg id="legendChevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      <span id="legendTitle"></span>
    </button>
    <!-- Five lines of instructions used to be pinned below the family list
         inside a fixed-height box, which is why the box showed 8 of 14 families
         and cut the rest off. Prose a reader needs once does not get permanent
         room; it gets a button. -->
    <button id="legendInfo" class="legend-info" type="button" aria-expanded="false" aria-controls="legendFoot">i</button>
    <button id="famAll" class="btn btn-ghost" type="button" style="font-size: 12px; padding: 0 4px"></button>
  </div>
  <!-- The count the title card carried on a phone, where it belongs: beside the
       families it is counting. -->
  <div id="legendCount" style="font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent)"></div>
  <div id="legend" class="legend-scroll"></div>
  <div id="legendFoot" class="legend-foot" hidden></div>
  <!-- Outside the collapsible part on purpose: folding the legend away on a
       phone is the common case, and this is the one control in here somebody
       reaches for repeatedly. Hidden outright for a reader the tree does not
       place — a button that can only apologise is worse than no button. -->
  <button id="centerMe" class="btn btn-primary" type="button" hidden
          style="border-radius: 999px; justify-content: center; gap: 7px; font-size: 13px; min-height: 36px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    <span></span>
  </button>
</div>

<aside id="sheet" class="sheet" hidden>
  <!-- On a phone this panel is a bottom sheet and this is what moves it. On a
       laptop it is a side dock and the grip is hidden — the CSS decides, so
       there is one panel rather than two. -->
  <button id="sheetGrip" class="sheet-grip" type="button"></button>
  <div class="sheet-head">
    <button id="sheetToggle" class="sheet-title" type="button" aria-expanded="true" aria-controls="sheetBody">
      <svg id="sheetChevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      <span id="sheetName"></span>
    </button>
    <!-- Only for a person: a settlement sheet is a list, not a stop on a walk.
         paintSheet() shows and dims these; see the trail block in the script. -->
    <div id="sheetNav" class="sheet-nav" hidden>
      <button id="sheetPrev" class="icon-btn" type="button">
        <svg class="chev-back" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
      <button id="sheetNext" class="icon-btn" type="button">
        <svg class="chev-fwd" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
    </div>
    <button id="sheetClose" class="icon-btn sheet-x" type="button">×</button>
  </div>
  <div id="sheetSub" class="sheet-sub"></div>
  <div id="sheetBody" class="sheet-body"></div>
</aside>

<div id="toast" class="toast" hidden></div>

<script>

 * Three things this page holds that the design's standalone version could not:
 *
 *   * families are rows now, so a pin's colour is the colour the family chose
 *     and editing it here writes to the DB (and the change log) rather than to
 *     a local variable;
 *   * settlements come from the `places` table, which is geocoded out of band —
 *     nothing here calls a geocoder, and a city with no coordinates is counted
 *     out loud instead of quietly dropped;

    spotKinds: { birth: 'מקום לידה', death: 'מקום פטירה', burial: 'מקום קבורה', place: 'מקום' },

    hintLabel: 'הסבר על המפה',

    wedInto: function (n) { return 'נישא/ה למשפחת ' + n; },
    bornPlusWed: function (a, b) { return a + ' נולדו למשפחה, ' + b + ' נישאו אליה'; },
    /* The same thing bornPlusWed says in a tooltip — which a phone has no way
       of showing, and "91 +1" is not self-explanatory. It goes in the legend's
       own explanation, where a thumb can reach it. */

    wedNote: 'הסינון כולל גם מי שנישאו למשפחה — הסימון המקווקו — בצבע המשפחה שממנה באו.',
    // The line under a family's name: how the reader reaches it. Worded exactly
    // as the tree's families panel words it — same family, same sentence. A

    kinVia: function (rel, name, route) {
      return rel + (route || / שלי$/.test(rel) ? ' · ' : ' ') + name;
    },
    openInTree: 'פתיחה בעץ', peopleIn: function (n) { return n + ' אנשים'; },

    contactNames: { whatsapp: 'וואטסאפ', instagram: 'אינסטגרם', facebook: 'פייסבוק', linkedin: 'לינקדאין' },
    // The same "tell us about yourself" prompt the tree raises, worded

    profileBody: 'את הפרטים בעץ ממלאים בני משפחה זה על זה, אז דווקא הכרטיס שלך הוא לרוב הריק ביותר. חסרים אצלך:',

    household: 'משק בית',
    age: 'גיל', saveFailed: 'שינוי הצבע לא נשמר', close: 'סגירה',
    // The trail through the people already opened. Same words as the tree's,
    // because it is the same walk seen from the other page.
    histPrev: 'הקודם', histNext: 'הבא',
    histTo: function (n) { return 'חזרה אל ' + n; },
    histToNext: function (n) { return 'קדימה אל ' + n; },
    relDesc: 'הורים וילדים', relSib: 'אחים ואחיות',
    relOff: function (n) { return 'ועוד ' + n + ' שלא על המפה'; },
    relHint: 'הקישו על אדם או על עיגול של קבוצה כדי למתוח את קווי הקִרבה: חץ מהורה לילד, קו מקווקו בין אחים.',
    // The four groups on a person's sheet, and the word under each name.
    kinParents: 'הורים', kinSpouse: 'בן/בת זוג', kinSiblings: 'אחים ואחיות', kinChildren: 'ילדים',
    kinFather: 'אב', kinMother: 'אם', kinHusband: 'בעל', kinWife: 'אישה',
    kinBrother: 'אח', kinSister: 'אחות', kinHalfBrother: 'אח למחצה', kinHalfSister: 'אחות למחצה',
    kinSon: 'בן', kinDaughter: 'בת', kinHalfSibling: 'אח/ות למחצה',
  },
  en: {
    dir: 'ltr', other: 'עברית', otherCode: 'he',
    title: 'The family on the map', toTree: 'Tree', tabMap: 'Map', fit: 'Fit Israel', fitShort: 'Israel',
    families: 'Families', searchPh: 'Find a person or place…', noMatch: 'Nothing found',
    placeTag: 'place', noAddress: 'no address in the tree', centerMe: 'Centre on me',
    cannotPlace: function (n) { return n + ' has no address in the tree — the card is open, the map stays put.'; },
    copy: 'Copy a link to this view', copied: 'Link copied', copyFailed: 'Could not copy — take it from the address bar',
    spotKinds: { birth: 'Place of birth', death: 'Place of death', burial: 'Place of burial', place: 'Place' },
    spotClear: 'Clear this mark',
    showAll: 'Show all', colorTitle: function (n) { return 'Colour of the ' + n + ' family'; },
    origin: 'Country of origin', unknownOrigin: 'unknown', origins: 'Origins',
    anyShare: 'Everyone with any share of this origin',
    familyFilterHint: 'Filter by family', showAllFamilies: 'All families', showAllOrigins: 'All origins',
    counted: function (a, b) { return a + ' of ' + b + ' have a place to live'; },

/* ───────── the map ───────── */
var map = L.map('map', { zoomControl: false, minZoom: 6, maxZoom: 17 });

}
placeZoom();
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19, opacity: 0.82,

var ISRAEL = L.latLngBounds([29.45, 34.2], [33.35, 35.95]);
/* The opening view is Israel even though some of the family is not in it.
   Fitting everybody would mean opening on a world map on which this country —
   where all but a dozen of them live — is four pixels wide, to make ten people

   search box, which answers to a country's name, and by the line in the legend
   that says how many there are and where. */

/* Where each person's pin goes.
 *
 * Someone with a full address sits on their house; everyone else is spread

 * that moved every time the map redrew would be unusable. */
var ADDR = {};
(window.FAMILY_ADDRESSES || []).forEach(function (a) { ADDR[a.key] = a; });
function addrKey(p) {

    return String(v == null ? '' : v).replace(/["'׳״]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
  }).join('|');

  // country would stop being found by the page that draws it.

}

 * two unrelated families can both live on הרצל — and a yishuv filed as
 * its own street with no number (טלמון / טלמון, the standing shape for a
 * settlement that has no street names) is a town, which is what the town pin
 * already says. Both would otherwise be drawn as one large family living

var HH = {};                       // household key → its members, in tree order
located.forEach(function (p) {

});
var hhOf = {};                     // person id → household key, SHARED doors only

located.forEach(function (p) {

 * this page knows — and never per person.
 *

 * most of them: a household of five whose street OSM has never heard of used to
 * take five slots on the town ring and be drawn as five separate points spread
 * across the town, which reads as five unrelated households. They are one door,
 * so they get one slot and one point, whether or not anyone could place it. */
var jitter = {}, byCity = {};
located.forEach(function (p) {

  var units = byCity[c].units, base = [PLACE[c].lat, PLACE[c].lng];

 * fall through to the ordinary cluster. */

/* Ages are counted to the last birthday, not by subtracting the years. This
   used to be `thisYear - birthYear`, which made everyone whose birthday had not
   come round yet a year too old — in mid-August that was 124 of the 305 living
   people with a real date of birth, and it disagreed with the tree, which had
   always counted properly. A record that is only a year ("1988") still has to
   assume the 1st of January, same as the tree does; that one is ±1 by nature. */

}
/* When this person was last USING the app, read as a distance — see

   not failed to visit. Kept word-for-word in step with the tree's ago() /
   seenLabel(), which is the copy a reader is more likely to have seen first.

  var days = Math.floor(ms / 86400000);

    .sort(function (x, y) { return y.list.length - x.list.length; })
    .forEach(function (blob) {

                + (ring ? 'var(--color-accent)' : c.line)
                + (ring ? ';box-shadow:0 0 0 ' + (sel ? '4px color-mix(in srgb, var(--color-accent) 35%' : '3px color-mix(in srgb, var(--color-accent) 26%') + ', transparent)' : '') + '">'
                + esc(((p.first || ' ')[0] + (p.last || ' ')[0]).trim()) + '</div>'
                + '<div class="pin-label">' + esc(personName(p)) + '</div>',
        }),

      ? '<div class="cluster-tag">' + keys.slice(0, 3).map(function (k) {

        className: '', iconSize: [size, size + (tag ? 58 : 4)], iconAnchor: [size / 2, size / 2],
        html: '<div class="cluster' + (held ? ' cluster-sel' : '') + '" style="width:' + size + 'px;height:' + size + 'px;font-size:'
