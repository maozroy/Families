   is not a letter or a number. */
var ROOF = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor"'
  + ' d="M8 1.7 1.2 7.1l.9 1.1L3 7.5V14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7.5l.9.7.9-1.1L8 1.7Z"/></svg>';

function colorOf(key) { return FAM[key] ? FAM[key].sh.line : NEUTRAL.line; }
function labelOf(key) { return FAM[key] ? famName(FAM[key]) : key; }

/* ───────── the lines between people ───────── */
/* Clicking somebody — or a cluster, or a settlement, the drawing is the same —
 * draws the close family of everyone selected, in two hands that cannot be
 * mistaken for one another:
 *
 *   * a line down the generations, parent → child, which grows as it goes and
 *     ends in an arrowhead — so it reads as a direction along its whole length
 *     and not only at the tip, which is where the pins and their labels are;
 *   * a dashed line of even weight, no head, between siblings — a relation
 *     with no direction, and nothing to mistake for one.
 *
 * Each line takes the colour of the family at the FAR end, so a line that
 * leaves the family says so in the colour of the family it arrives at. Over
 * map tiles a bare stroke disappears against a motorway, so every line is laid
 * on a casing in the page's paper colour first.
 *
 * Everything here is recomputed on each render, because the trimming is in
 * screen pixels: at z8 two pins are a thumb apart and at z16 they are a screen
 * apart, and the same latlngs have to look right at both. */
var PAPER = (getComputedStyle(document.documentElement).getPropertyValue('--color-bg') || '').trim() || '#f5ead8';
/* Half-widths, in screen pixels, at the parent end and at the child end. A
   descent line is a long thin wedge rather than a stroke — that is the whole
   direction cue — so it is drawn as a polygon; siblings stay an ordinary
   dashed stroke. */
var WEDGE = { parent: 0.7, child: 1.9, casing: 1.7 };
var SIB_WEIGHT = 2.2;

/** The visible part of a line between two pins, or null if they are too close
    together for one to read as a line at this zoom. */
function trimmed(a, b) {
  var A = map.latLngToLayerPoint(a.ll), B = map.latLngToLayerPoint(b.ll);
  var dx = B.x - A.x, dy = B.y - A.y, len = Math.sqrt(dx * dx + dy * dy);
  if (!len) return null;
  var ux = dx / len, uy = dy / len, tail = a.r + 4, head = b.r + 6;
  var span = len - tail - head;
  if (span < 16) return null;
  return {
    a: L.point(A.x + ux * tail, A.y + uy * tail),
    b: L.point(B.x - ux * head, B.y - uy * head),
    ux: ux, uy: uy, nx: -uy, ny: ux, span: span,
  };
}

/** The wedge itself: `w1` wide where the parent is, `w2` where the child is. */
function wedge(seg, w1, w2) {
  return [
    map.layerPointToLatLng(L.point(seg.a.x + seg.nx * w1, seg.a.y + seg.ny * w1)),
    map.layerPointToLatLng(L.point(seg.b.x + seg.nx * w2, seg.b.y + seg.ny * w2)),
    map.layerPointToLatLng(L.point(seg.b.x - seg.nx * w2, seg.b.y - seg.ny * w2)),
    map.layerPointToLatLng(L.point(seg.a.x - seg.nx * w1, seg.a.y - seg.ny * w1)),
  ];
}

/** A chevron pointing the way the line goes, dropped on it at `at` of its length. */
function chevron(seg, at) {
  var x = seg.a.x + (seg.b.x - seg.a.x) * at, y = seg.a.y + (seg.b.y - seg.a.y) * at;
  var reach = 4.6, wing = 5.4;
  return [
    map.layerPointToLatLng(L.point(x - seg.ux * reach + seg.nx * wing, y - seg.uy * reach + seg.ny * wing)),
    map.layerPointToLatLng(L.point(x + seg.ux * reach, y + seg.uy * reach)),
    map.layerPointToLatLng(L.point(x - seg.ux * reach - seg.nx * wing, y - seg.uy * reach - seg.ny * wing)),
  ];
}

function drawRelations(spot, chosen) {
  if (!chosen.length) return;
  var casings = [], strokes = [], marks = [], drawn = {};
  relationsAround(chosen).forEach(function (rel) {
    var from = spot[rel.from.id], to = spot[rel.to.id];
    if (!from || !to) return;                    // counted in the panel, not drawn
    var seg = trimmed(from, to);
    if (!seg) return;                            // same pin, or all but touching
    var f = famOf(rel.other), col = (f ? f.sh : NEUTRAL).line;
    // Four cousins in one cluster are four relations along one line on screen.
    // Drawing it four times costs four paths and looks like one.
    var same = [rel.kind, col, Math.round(seg.a.x), Math.round(seg.a.y),
                Math.round(seg.b.x), Math.round(seg.b.y)].join(':');
    if (drawn[same]) return;
    drawn[same] = 1;

    if (rel.kind === 'sib') {
      var line = [map.layerPointToLatLng(seg.a), map.layerPointToLatLng(seg.b)];
      casings.push(L.polyline(line, {
        color: PAPER, weight: SIB_WEIGHT + 3.5, opacity: 0.85, lineCap: 'round', interactive: false,
      }));
      strokes.push(L.polyline(line, {
        color: col, weight: SIB_WEIGHT, opacity: 0.95, lineCap: 'round',
        dashArray: '2 7', interactive: false,
      }));
      return;
    }

    casings.push(L.polygon(wedge(seg, WEDGE.parent + WEDGE.casing, WEDGE.child + WEDGE.casing), {
      stroke: false, fillColor: PAPER, fillOpacity: 0.85, interactive: false,
    }));
    strokes.push(L.polygon(wedge(seg, WEDGE.parent, WEDGE.child), {
      stroke: false, fillColor: col, fillOpacity: 0.95, interactive: false,
    }));

    // The head, at the child's end. Leaflet has no arrows, and an SVG marker def
    // would have to be minted per colour anyway.
    var ang = Math.atan2(seg.uy, seg.ux), size = 11, spread = 0.44;
    marks.push(L.polygon([
      map.layerPointToLatLng(seg.b),
      map.layerPointToLatLng(L.point(seg.b.x - size * Math.cos(ang - spread), seg.b.y - size * Math.sin(ang - spread))),
      map.layerPointToLatLng(L.point(seg.b.x - size * Math.cos(ang + spread), seg.b.y - size * Math.sin(ang + spread))),
    ], { color: PAPER, weight: 2, opacity: 0.85, fillColor: col, fillOpacity: 1, interactive: false }));

    // On a long line the head is far from the middle of it, and a line whose
    // ends are both under a label reads as no direction at all. One chevron
    // partway along says which way it runs without turning into a dotted rule.
    if (seg.span > 90) {
      marks.push(L.polyline(chevron(seg, seg.span > 260 ? 0.4 : 0.52), {
        color: col, weight: 2.4, opacity: 0.95, lineCap: 'round', lineJoin: 'round', interactive: false,
      }));
      if (seg.span > 260) {
        marks.push(L.polyline(chevron(seg, 0.72), {
          color: col, weight: 2.4, opacity: 0.95, lineCap: 'round', lineJoin: 'round', interactive: false,
        }));
      }
    }
  });
  // Casings first, all of them: drawn line by line, one relation's casing would
  // rub out the neighbouring relation's stroke where the two cross.
  casings.forEach(function (l) { l.addTo(layer); });
  strokes.forEach(function (l) { l.addTo(layer); });
  marks.forEach(function (l) { l.addTo(layer); });
}

/* ───────── the trail: back and forward through people already opened ────────
   The same walk the tree page keeps, for the same reason: following relatives
   from one card to the next is how this map gets read, and `syncUrl` writes
   the address bar with replaceState (every pan and zoom goes through it), so
   the browser's own Back has nothing of that walk in it.

   `hist` holds person NUMBERS, which is what `state.person` is and what the
   URL carries — never a slug. Opening somebody new from the middle drops what
   was ahead, exactly like a browser. Not persisted and not in the URL: a link
   pasted into the family group should hand over a place, not a journey. */
var hist = [], histAt = -1;
function noteVisit(no) {
  no = String(no || '');
  if (!no || hist[histAt] === no) return;
  hist = hist.slice(0, histAt + 1).concat([no]);
  if (hist.length > 60) hist = hist.slice(hist.length - 60);
  histAt = hist.length - 1;
}
/* The map — unlike the tree — really does push a history entry per selection,
   so the browser's own Back moves between people here too. When it does, the
   trail must move WITH it rather than record the arrival as a new step: a
   browser Back onto the previous person is that person, not a fresh visit, and
   treating it as one would leave the forward arrow pointing at somebody the
   reader never went forward from. Only an arrival that is neither neighbour is
   a new step. */
function histSyncTo(no) {
  no = String(no || '');
  if (!no || hist[histAt] === no) return;
  if (hist[histAt - 1] === no) { histAt--; return; }
  if (hist[histAt + 1] === no) { histAt++; return; }
  noteVisit(no);
}
/* Where a press would land, or -1. Anyone the data no longer knows about —
   deleted in another tab, or a `?p=` for a number that has gone — is stepped
   over rather than offered as a stop that opens nothing. */
function histTarget(dir) {
  for (var i = histAt + dir; i >= 0 && i < hist.length; i += dir) if (byNo[hist[i]]) return i;
  return -1;
}
function histGo(dir) {
  var i = histTarget(dir);
  if (i < 0) return;
  histAt = i;
  // The same landing a pin click or a relative chip produces, with the trail
  // held still — this IS the trail moving.
  goToPerson(byNo[hist[i]], true);
}
/* Dimmed at the ends rather than disabled, so the pair does not change width
   under the reader's thumb as they walk; histGo() clamps either way. */
function paintHistNav() {
  var wrap = document.getElementById('sheetNav');
  if (!wrap) return;
  wrap.hidden = !state.person;
  if (wrap.hidden) return;
  [[-1, 'sheetPrev', 'histPrev', 'histTo'], [1, 'sheetNext', 'histNext', 'histToNext']].forEach(function (row) {
    var i = histTarget(row[0]);
    var btn = document.getElementById(row[1]);
    var label = i < 0 ? T[row[2]] : T[row[3]](personName(byNo[hist[i]]));
    btn.style.opacity = i < 0 ? '0.3' : '1';
    btn.title = label;
    btn.setAttribute('aria-label', label);
  });
}

/* Selecting somebody is a redraw and not just a panel: the halo on their pin and
   the lines to their relatives are both render()'s work. */
function selectPerson(p) {
  noteVisit(p.no);
  state.person = String(p.no || '');
  state.city = '';
  state.group = [];
  syncUrl(true);
  render();
  paintSheet();
}

/* Clicking a cluster keeps its old job — it drills in two zoom levels — and now
   also holds on to the people it contained, by number. The zoom that follows
   pulls them apart into separate pins, and the lines redraw from wherever each
   of them lands. */
function selectGroup(list, ll) {
  state.group = list.map(function (p) { return String(p.no || ''); }).filter(Boolean);
  state.person = '';
  state.city = '';
  syncUrl(true);
  render();
  paintSheet();
  map.setView(ll, Math.min(17, map.getZoom() + 2));
}

/** Nobody, and nothing said about nobody. */
function clearSelection(push) {
  if (!state.person && !state.city && !state.group.length) return false;
  // The search box named what was selected; letting go of the selection has to
  // let go of the name too, or it reads as a filter that is still on.
  if (typeof qEl !== 'undefined' && qEl) qEl.value = '';
  state.person = '';
  state.city = '';
  state.group = [];
  syncUrl(!!push);
  render();
  paintSheet();
  return true;
}

/* ───────── the details panel ───────── */
/* A card pinned to a marker is the wrong shape for this: on a phone it covered
   the map it was describing, and the thing a reader wants to keep looking at is
   the map. The panel is docked at the side instead, and the part that grows
   without bound — the list of people in a group — is behind a chevron. */
var sheetEl = document.getElementById('sheet');
var sheetName = document.getElementById('sheetName');
var sheetSub = document.getElementById('sheetSub');
var sheetBody = document.getElementById('sheetBody');
function roomForSheet() { return window.innerWidth >= 700; }
var sheetOpen = roomForSheet();

/* The contact row, on the map's own sheet.
 *
 * The same four buttons the tree draws and the same rule for who gets them —
 * FamilyContacts.linksFor() makes both judgements, so a person who has an
 * Instagram on one page has it on the other and the dead have it on neither.
 * Written as a string because this sheet is innerHTML; the tree hands the same
 * data to its template runtime instead.
 *
 * Guarded on the function, not just the object: this page is installable and
 * /app/* is cached separately from the document, so a phone can hold a copy of
 * contacts.js older than this file. No module means no row, not a throw. */
function contactRowHtml(p) {
  var CN = globalThis.FamilyContacts;
  if (!CN || typeof CN.linksFor !== 'function') return '';
  var links = CN.linksFor(p, T.contactNames || {});
  if (!links.length) return '';
  return '<div class="contact-row" style="margin:8px 0 2px">' + links.map(function (c) {
    return '<a class="contact-btn" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer"'
      + ' title="' + esc(c.title) + '" aria-label="' + esc(c.title) + '"'
      + ' style="--cbrand:' + esc(c.brand) + '">'
      + '<span class="ci" style="background-image:' + c.icon + '"></span></a>';
  }).join('') + '</div>';
}

function personSheet(p) {
  var f = famOf(p);
  var into = marriedIn(p) ? FAM[spouseFam[p.id]] : null;
  return {
    title: personName(p),
    sub: esc([addressLine(p), lifeLine(p)].filter(Boolean).join(' · ')) + relKey(relSummary([p])),
    body: (f ? '<div style="margin:2px 0 4px"><span class="tag" style="background:' + f.sh.fill + ';color:' + f.sh.ink + '">'
        + esc(famName(f)) + '</span>'
        + (into ? '<span class="tag" style="margin-inline-start:5px;border:1px dashed ' + into.sh.line + ';color:'
            + into.sh.ink + '">' + esc(T.wedInto(famName(into))) + '</span>' : '')
        + '</div>' : '')
      + contactRowHtml(p)
      + seenHtml(p)
      + '<a class="pop-link" href="' + treeHref(p) + '">' + esc(T.openInTree) + ' ›</a>'
      + originBarHtml(p.originMix)
      // Last, because it is the only part of a person's sheet that grows: the
      // three lines above it stay put whoever is selected.
      + kinHtml(p),
  };
}

/* Several people at once: a cluster that was clicked, or a settlement that was
   searched for. `title` is the settlement's name where there is one name to
   give, and how many settlements it covers where there is not. */
function groupSheet(list, title) {
  var cities = {}, mix = {};
  list.forEach(function (p) { cities[pKey(p)] = 1; mix[famKey(p)] = (mix[famKey(p)] || 0) + 1; });
  var names = Object.keys(cities).map(placeLabel);
  var keys = Object.keys(mix).sort(function (x, y) { return mix[y] - mix[x]; });
  /* A household is titled by its door rather than by its town — "עומר" over a
     list of four people who all live at נורית 34 answers a question nobody
     asked. Only when the reader has not already picked a town, whose name is
     the title they asked for. */
  var house = !title && blobHousehold(list) ? list[0] : null;
  return {
    title: house ? addressLine(house)
      : title || (names.length === 1 ? names[0] : T.places(names.length)),
    sub: (house ? esc(T.household) + ' · ' : '') + esc(T.peopleIn(list.length)) + ' · '
      + keys.map(function (k) { return esc(labelOf(k)) + ' ' + mix[k]; }).join(' · ')
      + relKey(relSummary(list)),
    /* Above the list of names, not below it: "what is this settlement made of"
       is the question the map is for, and under forty rows nobody would find
       the answer. A share too small to name is still drawn — see originBarHtml. */
    body: originBarHtml(globalThis.FamilyOrigin.groupMix(list), 0.03)
      + '<ul class="pop-list" style="margin-top:10px">' + list.slice(0, 40).map(personRow).join('') + '</ul>'
      + (list.length > 40 ? '<div style="font-size:12px;margin-top:6px">' + esc(T.andMore(list.length - 40)) + '</div>' : ''),
  };
}

/* Open or folded is decided per selection and then left to the reader: one
   person is three lines and always opens, a group is a list of forty and opens
   only where there is room for it. Toggling by hand sticks until the selection
   changes under it. */
var sheetKey = null;
function selectionKey() {
  if (state.person) return 'p:' + state.person;
  if (state.group.length) return 'g:' + state.group.join(',');
  return state.city ? 'c:' + state.city : '';
}

function paintSheet() {
  var list = selectedPeople();
  var parts = state.person && byNo[state.person] ? personSheet(byNo[state.person])
    : list.length ? groupSheet(list, placeLabel(state.city)) : null;
  if (!parts) {
    sheetEl.hidden = true; sheetKey = null;
    /* Lets the legend and the attribution have the bottom corner back. */
    document.body.classList.remove('has-sheet');
    return;
  }
  var key = selectionKey();
  var fresh = key !== sheetKey;
  if (fresh) {
    sheetKey = key;
    sheetOpen = !!state.person || roomForSheet();
    /* A new selection reopens at half on a phone: one person is a name and
       three lines, and a group is a list — half shows the top of either without
       burying the map. */
    if (narrowMap()) { sheetStop = 'half'; sheetDragPx = null; }
  }
  document.body.classList.add('has-sheet');
  sheetEl.hidden = false;
  sheetName.textContent = parts.title;
  sheetSub.innerHTML = parts.sub;
  sheetBody.innerHTML = parts.body;
  sheetBody.hidden = !sheetOpen;
  document.getElementById('sheetToggle').setAttribute('aria-expanded', sheetOpen ? 'true' : 'false');
  document.getElementById('sheetChevron').style.transform = sheetOpen ? 'none' : 'rotate(-90deg)';
  document.getElementById('sheetClose').setAttribute('aria-label', T.close);
  document.getElementById('sheetClose').title = T.close;
  paintHistNav();
  placeSheet();
  /* After the sheet has its height, not before — panSheet measures it. Deferred
     one frame so Leaflet sees the final container size. */
  if (fresh) requestAnimationFrame(panSheet);
}

/* The panel hangs under the toolbar, which is one row on a laptop and two or
   three on a phone — so where it starts is measured rather than guessed. On a
   wide screen it has its own column and can run to the bottom of the window; on
   a phone the legend is in that same column, and the panel stops above it. */
function placeSheet() {
  if (sheetEl.hidden) return;

  /* ── v2: on a phone this is a bottom sheet, not a top-docked side panel ───
     The old geometry put a 3/4-width card over the middle of the screen, which
     covered about 78% of the map and — the part that actually mattered — covered
     the pin it was describing. A bottom sheet leaves a strip of map above it,
     and panSheet() below moves the pin into that strip. */
  if (narrowMap()) {
    sheetEl.style.top = '';
    sheetEl.style.maxHeight = '';
    /* On the root, not on the sheet: custom properties inherit, and the
       attribution — which has to stay above the sheet to keep the OSM credit
       visible — is nowhere near it in the DOM. */
    document.documentElement.style.setProperty('--sheet-h', sheetPx() + 'px');
    return;
  }

  document.documentElement.style.removeProperty('--sheet-h');
  var bar = document.getElementById('topbar');
  var top = bar ? bar.getBoundingClientRect().bottom + 10 : 70;
  var floor = window.innerHeight - 18;
  var legend = document.querySelector('.legend-box').getBoundingClientRect();
  var box = sheetEl.getBoundingClientRect();
  if (legend.width && box.right > legend.left && box.left < legend.right) {
    floor = Math.min(floor, legend.top - 10);
  }
  sheetEl.style.top = Math.round(top) + 'px';
  sheetEl.style.maxHeight = Math.max(110, Math.round(floor - top)) + 'px';
}

/* ═══════════════════════════════════════════════════════════════════════════
   v2 — the bottom sheet
   ═══════════════════════════════════════════════════════════════════════════ */

function narrowMap() { return window.innerWidth <= 760; }

/* Three stops, the same idea as the tree page's: a peek that says the card is
   there, a half that shows the name and the counts, and a full for the list of
   forty people a settlement can hold. */
var sheetStop = 'half';
var sheetDragPx = null;
function sheetStops() {
  var h = window.innerHeight;
  return { peek: 96, half: Math.round(h * 0.42), full: Math.round(h * 0.86) };
}
function sheetPx() {
  if (sheetDragPx != null) return sheetDragPx;
  var st = sheetStops();
  return st[sheetStop] || st.half;
}

/* Move the map so the thing the card describes is in the strip of map the card
   is not covering. Without this, tapping a pin hides that pin — which is the
   single worst thing a map card can do. */
function panSheet() {
  if (!narrowMap() || sheetEl.hidden) return;
  var target = selectedLatLng();
  if (!target) return;
  var size = map.getSize();
  /* The visible strip runs from under the toolbar to the top of the sheet; aim
     for its middle. */
  var bar = document.getElementById('topbar');
  var top = bar ? bar.getBoundingClientRect().bottom + 12 : 70;
  var visibleBottom = size.y - sheetPx();
  if (visibleBottom - top < 80) return;   // no strip worth aiming at
  var wantY = (top + visibleBottom) / 2;
  var pt = map.latLngToContainerPoint(target);
  var dy = pt.y - wantY;
  var dx = pt.x - size.x / 2;
  if (Math.abs(dy) < 24 && Math.abs(dx) < 24) return;
  map.panBy([dx, dy], { animate: true, duration: 0.35 });
}

/* Whatever the sheet is currently about, as a point on the map. `jitter` is
   where a pin actually sits — the exact address where one resolved, otherwise a
   stable spread around the middle of the town — so it is the right thing to aim
   at rather than the settlement centroid. */
function pinOf(p) { return p && jitter[p.id] ? L.latLng(jitter[p.id]) : null; }

function selectedLatLng() {
  if (state.person && byNo[state.person]) {
    var pin = pinOf(byNo[state.person]);
    if (pin) return pin;
  }
  var list = selectedPeople();
  if (!list.length) return null;
  var pts = list.map(pinOf).filter(Boolean);
  if (!pts.length) return null;
  return L.latLngBounds(pts).getCenter();
}

(function wireSheetGrip() {
  var grip = document.getElementById('sheetGrip');
  if (!grip) return;
  var start = null;
  var moved = false;
  grip.addEventListener('pointerdown', function (e) {
    if (!narrowMap()) return;
    start = { y: e.clientY, h: sheetPx() };
    moved = false;
    sheetEl.classList.add('dragging');
    try { grip.setPointerCapture(e.pointerId); } catch (_) {}
  });
  window.addEventListener('pointermove', function (e) {
    if (!start) return;
    var dy = start.y - e.clientY;          // up is taller
    if (Math.abs(dy) > 5) moved = true;
    var st = sheetStops();
    sheetDragPx = Math.max(st.peek, Math.min(st.full, start.h + dy));
    document.documentElement.style.setProperty("--sheet-h", sheetDragPx + "px");
  });
  var end = function () {
    if (!start) return;
    start = null;
    sheetEl.classList.remove('dragging');
    var st = sheetStops();
    var h = sheetDragPx != null ? sheetDragPx : st.half;
    var best = 'half', bestD = Infinity;
    ['peek', 'half', 'full'].forEach(function (k) {
      var d = Math.abs(st[k] - h);
      if (d < bestD) { bestD = d; best = k; }
    });
    sheetStop = best;
    sheetDragPx = null;
    placeSheet();
    panSheet();
  };
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  /* Tap cycles, for anyone who does not think to drag and for a keyboard. */
  grip.addEventListener('click', function () {
    if (moved) { moved = false; return; }
    if (!narrowMap()) return;
    var order = ['peek', 'half', 'full'];
    sheetStop = order[(order.indexOf(sheetStop) + 1) % order.length];
    sheetDragPx = null;
    placeSheet();
    panSheet();
  });
}());

/* What the two kinds of line mean, said where the lines were just drawn rather
   than in the legend at the other end of the screen. Relatives the map cannot
   place are counted out loud for the same reason the missing settlements are:
   a person with eight children and two lines needs to know why. */
/* The two swatches are the marks themselves at reading size — the wedge that
   widens into a head, and the even dashes — rather than two rules a reader has
   to take on trust. They point the way the page reads, so the wedge in Hebrew
   runs right to left like everything around it. */
function relMark(kind) {
  var flip = he() ? ' transform="scale(-1 1) translate(-26 0)"' : '';
  var body = kind === 'desc'
    ? '<path d="M1 5.15 L14 4.1 L14 5.9 Z" fill="currentColor"/>'
      + '<path d="M13.5 1.7 L20 5 L13.5 8.3 Z" fill="currentColor"/>'
    : '<path d="M1 5 H24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>';
  return '<svg class="rk" width="26" height="10" viewBox="0 0 26 10" aria-hidden="true"><g' + flip + '>'
    + body + '</g></svg>';
}

function relKey(sum) {
  if (!sum.desc && !sum.sib && !sum.off) return '';
  var bits = [];
  if (sum.desc) bits.push('<span>' + relMark('desc') + sum.desc + ' ' + esc(T.relDesc) + '</span>');
  if (sum.sib) bits.push('<span>' + relMark('sib') + sum.sib + ' ' + esc(T.relSib) + '</span>');
  if (sum.off) bits.push('<span class="rk-off">' + esc(T.relOff(sum.off)) + '</span>');
  return '<div class="pop-rel">' + bits.join('') + '</div>';
}

/* ───────── focusing something the URL asked for ───────── */

function focusPerson(no, opts) {
  var p = byNo[no];
  if (!p || !jitter[p.id]) return false;
  // A link to a person outranks a filter that would hide them — either filter,
  // and both are cleared, since clearing only the one that happened to be
  // checked first can still leave them hidden by the other.
  if (!visible(p)) { state.only = []; state.origins = []; syncUrl(false); renderLegend(); paintTreeLink(); }
  map.setView(jitter[p.id], Math.max(map.getZoom(), 15), { animate: !!(opts && opts.animate) });
  render();
  paintSheet();
  return true;
}

function focusCity(key, opts) {
  var place = PLACE[key];
  if (!place) return false;
  map.setView([place.lat, place.lng], Math.max(map.getZoom(), 12), { animate: !!(opts && opts.animate) });
  render();
  paintSheet();
  return true;
}

/* A link to a group — someone copied one, or pressed Back onto one. The people
   are known by number, so the view is fitted around wherever they are now
   rather than around the cluster that happened to hold them when it was made. */
function focusGroup(nos, opts) {
  var pts = nos.map(function (n) { return byNo[n]; })
    .filter(function (p) { return p && jitter[p.id]; })
    .map(function (p) { return L.latLng(jitter[p.id]); });
  if (!pts.length) return false;
  if (pts.length > 1) map.fitBounds(L.latLngBounds(pts), { padding: [80, 80], maxZoom: 16, animate: !!(opts && opts.animate) });
  else map.setView(pts[0], Math.max(map.getZoom(), 15), { animate: !!(opts && opts.animate) });
  render();
  paintSheet();
  return true;
}

/* ───────── the legend, where a family's colour lives ───────── */
var pending = {};
/* Thirteen families is a tall list, and on a phone the legend was eating the
   map. Collapsed by default on a narrow screen, open on a wide one; either way
   the header still says how many families are on. */
var legendOpen = window.innerWidth >= 640;
/* Closed by default: the notes are a thing you read once. */
var legendInfoOpen = false;
function renderLegend() {
  var shownCount = state.only.length || FAM_ORDER.filter(function (k) { return FAM[k].count > 0; }).length;
  document.getElementById('legendTitle').textContent = T.families + ' · ' + shownCount;
  var toggle = document.getElementById('legendToggle');
  toggle.setAttribute('aria-expanded', legendOpen ? 'true' : 'false');
  document.getElementById('legendChevron').style.transform = legendOpen ? 'none' : 'rotate(-90deg)';
  document.getElementById('legend').hidden = !legendOpen;
  /* v2: the notes are behind the ⓘ, not stapled under the list. Folding the
     legend closes both; opening it does not reopen the prose. */
  document.getElementById('legendFoot').hidden = !(legendOpen && legendInfoOpen);
  document.getElementById('legendCount').hidden = !legendOpen;
  var info = document.getElementById('legendInfo');
  info.hidden = !legendOpen;
  info.setAttribute('aria-expanded', legendInfoOpen ? 'true' : 'false');
  info.setAttribute('aria-label', T.hintLabel || 'i');
  info.title = T.hintLabel || '';
  var all = document.getElementById('famAll');
  all.textContent = T.showAll;
  all.hidden = !state.only.length;
  all.onclick = function () { state.only = []; syncUrl(true); render(); renderLegend(); };

  var box = document.getElementById('legend');
  box.textContent = '';
  FAM_ORDER.map(function (k) { return FAM[k]; })
    .filter(function (f) { return f.count > 0; })
    .forEach(function (f) {
      var on = !state.only.length || state.only.indexOf(f.key) >= 0;
      var row = document.createElement('div');
      row.className = 'fam-row';

      var swatch = document.createElement('label');
      swatch.className = 'swatch';
      swatch.style.background = f.sh.line;
      swatch.title = T.colorTitle(famName(f));
      var input = document.createElement('input');
      input.type = 'color';
      input.value = f.color;
      input.setAttribute('aria-label', T.colorTitle(famName(f)));
      // `input` repaints as the picker moves; `change` is the decision, and the
      // only thing worth telling the server about.
      input.addEventListener('input', function () { paintFamily(f, input.value); });
      input.addEventListener('change', function () { saveFamilyColor(f, input.value); });
      swatch.appendChild(input);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'fam-toggle';
      btn.style.borderColor = on ? f.sh.edge : 'transparent';
      btn.style.background = on ? f.sh.fill : 'transparent';
      btn.style.color = on ? f.sh.ink : 'color-mix(in srgb, var(--color-text) 45%, transparent)';
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      // The name and the count are one line of their own now that a second one
      // sits under them; without the wrapper they would share a flex row with
      // it and the count would drift to the end of whichever was longer.
      var head = document.createElement('span');
      head.className = 'head';
      var nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = famName(f);
      // Born into the family, then how many married in — because the filter
      // draws both and a bare "20" beside 23 pins reads as a bug. What the `+`
      // means is in the legend's explanation too: this title is a tooltip, and
      // most of the people reading this are on a phone.
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = f.count + (wedCount[f.key] ? ' +' + wedCount[f.key] : '');
      n.title = wedCount[f.key] ? T.bornPlusWed(f.count, wedCount[f.key]) : '';
      head.appendChild(nm); head.appendChild(n);
      btn.appendChild(head);

      // How the reader reaches this family. Absent for a reader the tree has
      // not placed — see famKin() — and the row is then the row it always was.
      var kinLine = famKin()[f.key];
      if (kinLine) {
        var kin = document.createElement('span');
        kin.className = 'kin';
        kin.textContent = kinLine;
        kin.title = kinLine;
        btn.appendChild(kin);
      }
      // The strip draws every share — it carries no labels, so nothing is
      // gained by dropping the thin ones and the proportions stay true. The
      // tooltip is its whole legend.
      var segs = globalThis.FamilyOrigin.segmentsOf(
        globalThis.FamilyOrigin.groupMix(famMembers[f.key] || []));
      if (segs.length) {
        var bar = document.createElement('span');
        bar.className = 'obar';
        bar.style.background = globalThis.FamilyOrigin.barCss(segs, T.dir === 'rtl', 1);
        bar.style.opacity = on ? '1' : '0.25';
        btn.title = originTip(segs);
        btn.appendChild(bar);
      }
      btn.onclick = function () { toggleFamily(f.key); };

      row.appendChild(swatch); row.appendChild(btn);
      box.appendChild(row);
    });

  var foot = document.getElementById('legendFoot');
  var notes = [];
  if (wedAny) notes.push(T.plusNote);
  if (state.only.length) notes.push(T.wedNote);
  if (noCity) notes.push(T.noCity(noCity));
  if (unmapped) notes.push(T.unmapped(unmapped));
  /* Where the rest of the family is. Counted off the pins actually drawn, so it
     goes away by itself when the filter above hides them and never claims
     somebody is on a map they are not on. */
  if (ABROAD_COUNT.n) notes.push(T.abroad(ABROAD_COUNT.n, ABROAD_COUNT.where));
  notes.push(T.relHint);
  notes.push(T.hint);
  foot.textContent = notes.join(' ');
  /* The line the hidden title card used to carry, next to the families it is
     counting. On a laptop the title card is still there and says it too — one
     of them is redundant at that width, and the redundant one is the cheap one
     to keep. */
  document.getElementById('legendCount').textContent = T.counted(located.length, PEOPLE.length);
  renderFilters();
  // Folding the legend gives the panel back the room it was avoiding.
  placeSheet();
}

/* ───────── the two filter buttons ─────────
 * One builder for both, because the only things that differ are the list, the
 * colour of a row and what a click does. Selection is shown by a tick and a
 * tinted row rather than by dimming the others: a menu where "nothing selected"
 * and "everything selected" look identical is how the legend version managed to
 * be invisible.
 */
function buildMenu(menu, btn, opts) {
  btn.classList.toggle('on', !!opts.chosen.length);
  btn.querySelector('.lbl').textContent = opts.label;
  btn.querySelector('.cnt').textContent = opts.chosen.length ? opts.chosen.length : '';
  btn.title = opts.chosen.length ? opts.chosen.map(opts.nameOf).join(' · ') : opts.hint;

  menu.textContent = '';
  var clear = document.createElement('button');
  clear.type = 'button';
  clear.className = 'filter-clear';
  clear.textContent = opts.clearLabel;
  clear.hidden = !opts.chosen.length;
  clear.onclick = opts.onClear;
  menu.appendChild(clear);

  opts.keys.forEach(function (k) {
    var on = opts.chosen.indexOf(k) >= 0;
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'filter-row';
    row.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) {
      row.style.background = 'color-mix(in srgb, ' + opts.colorOf(k) + ' 15%, transparent)';
      row.style.borderColor = 'color-mix(in srgb, ' + opts.colorOf(k) + ' 55%, transparent)';
    }
    var tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = '✓';
    var sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = opts.colorOf(k);
    var nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = opts.nameOf(k);
    var n = document.createElement('span');
    n.className = 'n';
    n.textContent = opts.countOf(k);
    row.appendChild(tick); row.appendChild(sw); row.appendChild(nm); row.appendChild(n);
    /* A second line where the menu has something to say about the entry — how
       the reader is related to that family. Optional, because the origins menu
       beside it has no such thing: a country is not related to anybody. */
    var sub = opts.subOf && opts.subOf(k);
    if (sub) {
      var s = document.createElement('span');
      s.className = 'sub';
      s.textContent = sub;
      s.title = sub;
      row.appendChild(s);
    }
    row.onclick = function () { opts.onPick(k); };
    menu.appendChild(row);
  });
}

function renderFilters() {
  var O = globalThis.FamilyOrigin;
  buildMenu(document.getElementById('famMenu'), document.getElementById('famBtn'), {
    label: T.families, hint: T.familyFilterHint, clearLabel: T.showAllFamilies,
    keys: FAM_ORDER.filter(function (k) { return FAM[k].count > 0; }),
    chosen: state.only,
    colorOf: function (k) { return FAM[k].sh.line; },
    nameOf: function (k) { return famName(FAM[k]); },
    countOf: function (k) { return FAM[k].count + (wedCount[k] ? ' +' + wedCount[k] : ''); },
    subOf: function (k) { return famKin()[k] || ''; },
    onPick: toggleFamily,
    onClear: function () { state.only = []; syncUrl(true); render(); renderLegend(); },
  });
  buildMenu(document.getElementById('orgMenu'), document.getElementById('orgBtn'), {
    label: T.origins, hint: T.anyShare, clearLabel: T.showAllOrigins,
    keys: ORIGIN_KEYS,
    chosen: state.origins,
    colorOf: function (c) { return O.colorOf(c); },
    nameOf: originLabel,
    countOf: function (c) { return ORIGIN_COUNT[c]; },
    onPick: toggleOrigin,
    onClear: function () { state.origins = []; syncUrl(true); render(); renderLegend(); },
  });
}

/* Open one menu at a time, and let the map have the click that closes it. */
function closeMenus(except) {
  [['famBtn', 'famMenu'], ['orgBtn', 'orgMenu']].forEach(function (pair) {
    if (pair[1] === except) return;
    document.getElementById(pair[1]).hidden = true;
    document.getElementById(pair[0]).setAttribute('aria-expanded', 'false');
  });
}
[['famBtn', 'famMenu'], ['orgBtn', 'orgMenu']].forEach(function (pair) {
  var btn = document.getElementById(pair[0]), menu = document.getElementById(pair[1]);
  btn.onclick = function (e) {
    e.stopPropagation();
    var open = menu.hidden;
    closeMenus(open ? pair[1] : null);
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  // A click inside is a selection, not a dismissal — the menus are multi-select
  // and closing on the first pick would make picking two a chore.
  menu.onclick = function (e) { e.stopPropagation(); };
});
document.addEventListener('click', function () { closeMenus(null); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenus(null); });

/* Same gesture as a family row, so the two lists behave identically: the first
   click solos, later clicks add, and unpicking the last one clears the filter
   rather than leaving a view with nobody in it. */
function toggleOrigin(c) {
  var i = state.origins.indexOf(c);
  if (!state.origins.length) state.origins = [c];
  else if (i >= 0) state.origins.splice(i, 1);
  else state.origins.push(c);
  syncUrl(true);
  render();
  renderLegend();
}

/* First click on a family solos it — that is the view somebody wants a link to.
   Clicking another adds it; clicking the last one selected clears the filter. */
function toggleFamily(key) {
  var i = state.only.indexOf(key);
  if (!state.only.length) state.only = [key];
  else if (i >= 0) state.only.splice(i, 1);
  else state.only.push(key);
  // A filter changes who is on the map, so it cannot leave behind a selection
  // made out of the people who were on it a moment ago — nor the panel that
  // described them.
  state.person = '';
  state.group = [];
  state.city = '';
  syncUrl(true);
  render();
  renderLegend();
  paintSheet();
}

function paintFamily(f, hex) {
  f.color = hex;
  f.sh = FamilyColors.shades(hex);
  render();
  renderLegend();
}

function saveFamilyColor(f, hex) {
  var before = pending[f.key] === undefined ? f.color : pending[f.key];
  pending[f.key] = before;
  fetch('/api/families/' + encodeURIComponent(f.key), {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ color: hex }),
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (out) {
      if (!out.ok) throw new Error((out.j && (he() ? out.j.error : out.j.error_en || out.j.error)) || T.saveFailed);
      delete pending[f.key];
    })
    .catch(function (err) {
      // The colour is already on screen, so a rejected save has to be taken back
      // or the family believes they changed something they did not.
      paintFamily(f, before);
      delete pending[f.key];
      toast(err.message || T.saveFailed);
    });
}

/* ───────── the search list: people, then places ───────── */
/* Matching lives in /app/fuzzy.js, shared with the tree's own search box and
   with the address pickers in its person form — one ranking, so a search box
   behaves the same in all three places.
 *
 * People and settlements share the one box rather than sitting in two, because
 * a reader looking at a map of the family types a name without first deciding
 * which kind of thing it is. "עומר" is both a given name and a town; the list says
 * which is which and lets them pick. A person outranks a place at the same
 * score — the map is of the family, not of Israel. */

/* A town abroad answers to its country's name as well as its own, in both
   languages: somebody looking for the relatives in Italy types "Italy", not
   "Rome", and a search that only knew town names would tell them there is
   nobody there. */
function placeSearchText(place) {
  if (!foreign(place.country)) return place.name;
  return [place.name, CO.name(place.country, 'he'), CO.name(place.country, 'en'), place.country]
    .filter(Boolean).join(' ');
}

var qEl = document.getElementById('q'), listEl = document.getElementById('qlist');
var cursor = -1, matches = [];

/* Only people the URL can name: `p=` carries the person number, and someone
   without one cannot be linked to, come back on Back, or be found again. */
var SEARCH_PEOPLE = PEOPLE.filter(function (p) { return p.no; });

function searchItems(q) {
  // An empty box is somebody who just clicked it — the settlement list is the
  // useful thing to browse there, and 300 names ranked by nothing is not.
  if (!String(q || '').trim()) {
    return FamilyFuzzy.rank('', PLACE_LIST, {
      key: function (p) { return placeSearchText(p); },
      weight: function (p) { return p.count; },
      limit: 30,
    }).map(function (p) { return { kind: 'place', place: p }; });
  }
  var items = SEARCH_PEOPLE.map(function (p) { return { kind: 'person', p: p }; })
    .concat(PLACE_LIST.map(function (p) { return { kind: 'place', place: p }; }));
  return FamilyFuzzy.rank(q, items, {
    key: function (it) {
      return it.kind === 'person' ? FamilyFuzzy.personNames(it.p) : placeSearchText(it.place);
    },
    // Ties go to people, and among places to the one the family actually lives
    // in. The offset is larger than any settlement's count can be.
    weight: function (it) { return it.kind === 'person' ? 1e6 : it.place.count; },
    limit: 24,
  });
}

function openList(q) {
  matches = searchItems(q);
  cursor = matches.length ? 0 : -1;
  drawList();
  listEl.hidden = false;
  qEl.setAttribute('aria-expanded', 'true');
}
function closeList() {
  listEl.hidden = true;
  qEl.setAttribute('aria-expanded', 'false');
  cursor = -1;
}
function drawList() {
  listEl.textContent = '';
  if (!matches.length) {
    var empty = document.createElement('div');
    empty.className = 'search-empty';
    empty.textContent = T.noMatch;
    listEl.appendChild(empty);
    return;
  }
  matches.forEach(function (it, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'search-opt';
    b.setAttribute('role', 'option');
    b.setAttribute('aria-selected', i === cursor ? 'true' : 'false');
    if (it.kind === 'person') {
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = sh(it.p).line;
      var pn = document.createElement('span');
      pn.className = 'nm';
      pn.textContent = personName(it.p);
      // Two people called מיכאל are told apart by where they live and when they
      // were born, which is exactly what the row has room for.
      var sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = [addressLine(it.p) || T.noAddress, lifeLine(it.p)].filter(Boolean).join(' · ');
      var no = document.createElement('span');
      no.className = 'n';
      no.textContent = it.p.no;
      b.appendChild(dot); b.appendChild(pn); b.appendChild(sub); b.appendChild(no);
    } else {
      var nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = placeLabel(it.place);
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = T.placeTag;
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = it.place.count;
      b.appendChild(nm); b.appendChild(tag); b.appendChild(n);
    }
    // mousedown, not click: blur fires first on click and would close the list
    // out from under the pointer.
    b.addEventListener('mousedown', function (e) { e.preventDefault(); choose(it); });
    listEl.appendChild(b);
  });
}
function choose(it) {
  if (it.kind === 'person') choosePerson(it.p); else choosePlace(it.place);
}
function choosePlace(place) {
  if (typeof place === 'string') place = PLACE[place];
  if (!place) return;
  qEl.value = placeLabel(place);
  closeList();
  qEl.blur();
  state.city = place.key || place.name;
  state.person = '';
  state.group = [];
  syncUrl(true);
  focusCity(state.city, { animate: true });
}
/* Centre on them and open their card — the same state a click on their pin
   produces, so Back, the copied link and the panel all behave identically
   whichever way the person was reached. Somebody with no address on file still
   gets their card; there is just nowhere for the map to go, and saying so is
   better than a search that looks like it did nothing.
 *
 * Shared by the search box and the "centre on me" button, which are two ways of
 * asking for the same thing. */
function goToPerson(p, viaTrail) {
  if (!viaTrail) noteVisit(p.no);
  state.person = String(p.no);
  state.city = '';
  state.group = [];
  syncUrl(true);
  if (focusPerson(state.person, { animate: true })) return true;
  render();
  paintSheet();
  toast(T.cannotPlace(personName(p)));
  return false;
}
function choosePerson(p) {
  qEl.value = personName(p);
  closeList();
  qEl.blur();
  goToPerson(p);
}

qEl.addEventListener('focus', function () { openList(qEl.value); });
qEl.addEventListener('input', function () { openList(qEl.value); });
qEl.addEventListener('blur', function () { setTimeout(closeList, 120); });
qEl.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (listEl.hidden) return openList(qEl.value);
    cursor = Math.max(0, Math.min(matches.length - 1, cursor + (e.key === 'ArrowDown' ? 1 : -1)));
    drawList();
    var opt = listEl.children[cursor];
    if (opt && opt.scrollIntoView) opt.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    if (!listEl.hidden && matches[cursor]) { e.preventDefault(); choose(matches[cursor]); }
  } else if (e.key === 'Escape') {
    closeList();
    qEl.blur();
  }
});

/* ───────── chrome ───────── */
function toast(text) {
  var el = document.getElementById('toast');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.hidden = true; }, 2600);
}

function paintChrome() {
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', T.dir);
  document.title = T.title;
  document.getElementById('title').textContent = T.title;
  document.getElementById('toTree').querySelector('span').textContent = T.toTree;
  document.getElementById('tabMap').textContent = T.tabMap;
  // Three rows of controls on a phone leaves no map; the long label is the one
  // thing here that can be shorter without losing meaning.
  /* The label lives in its own span now — writing textContent on the button
     would delete the icon beside it. Below 760px the CSS hides the span and the
     icon carries the meaning, so the accessible name has to come from the
     attribute rather than from the text. */
  var fitBtn = document.getElementById('fit');
  fitBtn.querySelector('.fit-label').textContent = window.innerWidth < 620 ? T.fitShort : T.fit;
  fitBtn.setAttribute('aria-label', T.fit);
  fitBtn.title = T.fit;
  document.getElementById('lang').textContent = T.other;
  document.getElementById('copy').title = T.copy;
  document.getElementById('copy').setAttribute('aria-label', T.copy);
  qEl.placeholder = T.searchPh;
  qEl.setAttribute('aria-label', T.searchPh);
  var meBtn = document.getElementById('centerMe');
  meBtn.hidden = !ME;
  meBtn.querySelector('span').textContent = T.centerMe;
  document.getElementById('count').textContent = T.counted(located.length, PEOPLE.length);
  renderLegend();
}

document.getElementById('legendToggle').addEventListener('click', function () {
  legendOpen = !legendOpen;
  renderLegend();
});

document.getElementById('legendInfo').addEventListener('click', function (e) {
  e.stopPropagation();
  legendInfoOpen = !legendInfoOpen;
  renderLegend();
});

/* "Where am I on this?" — the question every relative asks first, and until now
   the map had no answer to it that did not involve reading 300 pins. `me` is the
   person row the sign-in resolved to, so it needs no picking. */
var ME = (window.FAMILY_ME && window.FAMILY_ME.no && byNo[String(window.FAMILY_ME.no)]) || null;
document.getElementById('centerMe').addEventListener('click', function () {
  if (ME) goToPerson(ME);
});
document.getElementById('fit').addEventListener('click', function () {
  clearSelection(false);
  fit();
  render();
});

/* The panel's own two buttons: the chevron keeps the selection and folds the
   list away, the × lets go of the selection altogether. */
document.getElementById('sheetToggle').addEventListener('click', function () {
  sheetOpen = !sheetOpen;
  paintSheet();
});
document.getElementById('sheetClose').addEventListener('click', function () { clearSelection(true); });
document.getElementById('sheetPrev').addEventListener('click', function () { histGo(-1); });
document.getElementById('sheetNext').addEventListener('click', function () { histGo(1); });
/* The sheet's body is written as innerHTML and rewritten on every selection, so
   a relative chip cannot carry its own handler. It carries the person's number
   instead and the listener sits on the container, which outlives the chips. */
sheetBody.addEventListener('click', function (e) {
  var btn = e.target.closest && e.target.closest('.rel-chip');
  if (!btn) return;
  var p = byNo[btn.getAttribute('data-no')];
  if (p) goToPerson(p);
});
/* Clicking the map itself means "never mind" — Leaflet only fires this for the
   background, a click on a pin belongs to the pin. Escape does the same for a
   keyboard, except while the settlement box has it (there it closes the list). */
map.on('click', function () { clearSelection(false); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && e.target !== qEl) clearSelection(false);
});
window.addEventListener('resize', placeSheet);
document.getElementById('copy').addEventListener('click', function () {
  FamilyUrl.copy().then(function (ok) { toast(ok ? T.copied : T.copyFailed); });
});
document.getElementById('lang').addEventListener('click', function () {
  lang = T.otherCode;
  T = L10N[lang];
  try { localStorage.setItem('familyLang', lang); } catch (e) {}
  fetch('/api/lang', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lang: lang }) }).catch(function () {});
  paintChrome();
  placeZoom();
  render();
  paintSheet();
});

/* The tree link keeps the family filter, so "the Levi family" survives moving
   between the two pages. */
function paintTreeLink() {
  var qs = state.only.length ? '?family=' + encodeURIComponent(FamilyUrl.join(state.only)) : '';
  document.getElementById('toTree').setAttribute('href', '/tree' + qs);
}

/* ───────── viewport in the address bar ───────── */
var viewTimer = null;
map.on('zoomend moveend', function () {
  render();
  paintTreeLink();
  clearTimeout(viewTimer);
  viewTimer = setTimeout(function () {
    var c = map.getCenter();
    pushUrl({ z: map.getZoom(), at: c.lat.toFixed(4) + ',' + c.lng.toFixed(4) });
  }, 400);
});

/* ───────── one place out of one life ─────────
 *
 * `?at=lat,lng&label=…&kind=birth|death|burial` — what the tree's person card
 * links to when a reader asks to see a birthplace or a grave on the map.
 *
 * It is a MARK, not a selection: nothing about the family filter, the legend or
 * the pin sizes changes, because this map answers "where does the family live"
 * and a town somebody was born in in 1912 is not an answer to that. Putting a
 * birthplace into `places` as a resident pin would have added a settlement with
 * a headcount of zero and quietly changed what every count on the page means.
 *
 * `at` was already the viewport in the address bar, so this rides on it rather
 * than inventing a second coordinate parameter — a link to a mark IS a link to
 * a view of that spot, and pasting it in a chat gets both.
 */
var spotLayer = L.layerGroup().addTo(map);

function clearSpot() {
  spotLayer.clearLayers();
  pushUrl({ label: '', kind: '' });
}

function paintSpot(params) {
  // Reads the params it is given, not the ones the page loaded with: Back out
  // of a marked view has to take the mark away with it.
  var q = params || U;
  spotLayer.clearLayers();
  var at = String(q.at || '').split(',');
  var label = String(q.label || '').trim();
  if (!label || at.length !== 2 || !isFinite(+at[0]) || !isFinite(+at[1])) return null;
  var ll = [+at[0], +at[1]];
  var kind = ['birth', 'death', 'burial'].indexOf(String(q.kind || '')) >= 0 ? q.kind : 'place';
  /* One glyph per kind, and none of them a house: a cradle would be twee and a
     headstone reads as a death notice on a page a child might open. A star for
     a birth, a leaf for a death, a stone for a grave. */
  var ICON = {
    birth: '<path d="M12 3.6 13.9 9h5.6l-4.5 3.4 1.7 5.4L12 14.6 7.3 17.8 9 12.4 4.5 9h5.6Z"/>',
    death: '<path d="M12 20c0-5 2-9 7-11 .6 5.4-2 10-7 11Zm0 0c0-4-1.6-7.2-5.6-8.8C5.9 15.6 8 19.2 12 20Z"/>',
    burial: '<path d="M7.5 20V10a4.5 4.5 0 0 1 9 0v10Z"/><path d="M6 20h12"/>',
    place: '<circle cx="12" cy="12" r="4"/>',
  };
  var m = L.marker(ll, {
    icon: L.divIcon({
      className: '', iconSize: [34, 58], iconAnchor: [17, 34],
      html: '<div class="spot"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--color-bg)" '
            + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON[kind] + '</svg></div>'
            + '<div class="spot-label">' + esc(label) + '</div>',
    }),
    // Above the family's own pins: it is what the reader followed a link to see.
    zIndexOffset: 1000,
  });
  // A tap clears it, which is also the only way back to an ordinary map without
  // editing the address bar. Said out loud in the tooltip rather than left to
  // be discovered.
  m.bindTooltip((T.spotKinds[kind] || T.spotKinds.place) + ' — ' + T.spotClear, { direction: 'top' });
  m.on('click', clearSpot);
  m.addTo(spotLayer);
  return ll;
}

/* ───────── boot ───────── */
paintChrome();

(function start() {
  var at = String(U.at || '').split(',');
  var z = +U.z;
  var spot = paintSpot();
  if (spot) {
    /* A link to a mark is a link to a spot, not to a viewport somebody happened
       to be looking at: it opens close enough to see the town it is in, unless
       the link carried a zoom of its own. */
    map.setView(spot, (z >= 6 && z <= 17) ? z : 13, { animate: false });
  } else if (at.length === 2 && isFinite(+at[0]) && isFinite(+at[1]) && z >= 6 && z <= 17) {
    map.setView([+at[0], +at[1]], z, { animate: false });
  } else {
    fit();
  }
  render();
  paintTreeLink();
  // A shared link is the first stop on the walk, so the first Back from one is
  // correctly nothing rather than a step into somebody else's browsing.
  if (state.person) { noteVisit(state.person); if (!focusPerson(state.person)) { state.person = ''; syncUrl(false); } }
  else if (state.group.length) { if (!focusGroup(state.group)) { state.group = []; syncUrl(false); } }
  else if (state.city) { if (!focusCity(state.city)) { state.city = ''; syncUrl(false); } }
}());

/* Back and Forward move between views rather than off the page. */
FamilyUrl.onPop(function (params) {
  paintSpot(params);
  state.only = FamilyUrl.list(params.family).filter(function (k) { return FAM[k]; });
  state.origins = FamilyUrl.list(params.origin).filter(function (c) { return ORIGIN_COUNT[c]; });
  state.city = params.city && PLACE[params.city] ? params.city : '';
  state.person = params.p && byNo[params.p] ? params.p : '';
  histSyncTo(state.person);
  state.group = readGroup(params.g);
  render();
  renderLegend();
  paintTreeLink();
  if (state.person) focusPerson(state.person, { animate: true });
  else if (state.group.length) focusGroup(state.group, { animate: true });
  else if (state.city) focusCity(state.city, { animate: true });
  else paintSheet();   // Back onto a view with nobody in it closes the panel.
});

/* ═══════════════════════════════════════════════════════════════════════════
   v2 — offline, and the palette at sunset
   ═══════════════════════════════════════════════════════════════════════════ */

/* Root scope now that these are the live pages, and the old /v2/-scoped worker
   is retired on sight — see the same block in tree-v2.html. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
  if (navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { if (/\/v2\/$/.test(r.scope)) r.unregister(); });
    }).catch(function () {});
  }
}

/* The map goes on looking live with cached tiles, so being offline has to be
   said. Nothing here is editable except a family's colour, and that is exactly
   the thing that would silently fail. */
(function offlineNote() {
  var el = document.createElement('div');
  el.id = 'offlineBar';
  el.style.cssText = 'position:fixed;z-index:900;inset-inline:0;bottom:0;padding:calc(8px + var(--safe-b)) 14px 8px;'
    + 'background:var(--color-neutral-900);color:var(--color-neutral-100);font-size:13px;text-align:center';
  el.hidden = true;
  document.body.appendChild(el);
  var paint = function () {
    el.textContent = T.offline;
    el.hidden = navigator.onLine !== false;
  };
  window.addEventListener('online', paint);
  window.addEventListener('offline', paint);
  paint();
}());

/* A family's colour is derived in OKLCH against the page it sits on, so the
   theme flipping means re-deriving all fourteen and redrawing. */
if (globalThis.V2Theme) {
  globalThis.V2Theme.onChange(function () {
    FAM_ORDER.forEach(function (k) { FAM[k].sh = FamilyColors.shades(FAM[k].color); });
    render();
    renderLegend();
    paintSheet();
  });
}

/* "Tell us about yourself", on the map.
 *
 * Same question, same month-long silence after a dismissal, same wording — all
 * three come from /app/profile.js and the T table, so a relative who lands here
 * rather than on the tree does not meet a different app.
 *
 * The one difference is the button: the form lives on the tree, so "fill in my
 * details" is a link to `/tree?p=<no>&edit=1` rather than something this page
 * can do. It dismisses on the way out, so leaving the form without saving does
 * not bring the dialog straight back on the next visit.
 *
 * Raised after a delay, for the reason the tree's is: a modal over a map that
 * has not drawn yet reads as a login wall.
 */
(function profilePrompt() {
  var PR = globalThis.FamilyProfile;
  if (!PR || typeof PR.shouldPrompt !== 'function' || !ME) return;
  if (!PR.shouldPrompt(ME)) return;

  setTimeout(function () {
    // Somebody who has already gone somewhere specific — a person, a settlement
    // — came here to look at that. Ask them next time.
    if (state.person || state.group.length) return;

    var back = document.createElement('div');
    back.className = 'dialog-backdrop';
    back.style.cssText = 'position:fixed;inset:0;z-index:1000;background:color-mix(in srgb, #17150f 55%, transparent);'
      + 'display:grid;place-items:end center;padding:14px 14px calc(14px + var(--safe-b))';
    var chips = PR.missingLabelled(ME, T.profileItems).map(function (m) {
      return '<span class="tag">' + esc(m.label) + '</span>';
    }).join('');
    back.innerHTML = '<div style="background:var(--color-neutral-100);border-radius:var(--radius-lg);'
      + 'box-shadow:var(--shadow-lg);padding:20px;max-width:460px;width:100%;max-height:80dvh;overflow:auto">'
      + '<h3 style="margin:0 0 8px;font-family:var(--font-heading);font-size:22px">' + esc(T.profileTitle) + '</h3>'
      + '<p style="margin:0 0 12px;font-size:15px;line-height:1.55">' + esc(T.profileBody) + '</p>'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px">' + chips + '</div>'
      + '<p style="margin:12px 0 0;font-size:13px;line-height:1.55;color:color-mix(in srgb, var(--color-text) 60%, transparent)">'
      + esc(T.profileWhy) + '</p>'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">'
      + '<a class="btn btn-primary" id="profileFill" href="/tree?p=' + esc(ME.no) + '&edit=1"'
      + ' style="border-radius:999px;flex:1 1 180px;justify-content:center;text-decoration:none">' + esc(T.profileFill) + '</a>'
      + '<button class="btn btn-ghost" id="profileLater" type="button" style="border-radius:999px">' + esc(T.profileLater) + '</button>'
      + '</div></div>';

    var close = function () { PR.dismiss(ME); back.remove(); };
    back.addEventListener('click', function (e) { if (e.target === back) close(); });
    back.querySelector('#profileLater').addEventListener('click', close);
    // Remember before navigating: the tree is a fresh document and cannot know
    // this happened, and coming back to a map that asks again would be a nag.
    back.querySelector('#profileFill').addEventListener('click', function () { PR.dismiss(ME); });
    document.body.appendChild(back);
  }, 1400);
}());

/* The stops are a proportion of the window, so a rotation moves them. */
window.addEventListener('resize', function () { placeSheet(); });

/* A handle on the page's own working state, for scripts/map-household-selftest.mjs.
 *
 * Deliberately a real line of code rather than something a test injects: the
 * grouping this page does — which people share a door, and where each door was
 * drawn — is settled before a single marker exists, so there is nothing in the
 * DOM to assert it against. Nothing secret leaves through here; every one of
 * these is derived from window.FAMILY, which the browser already has. */
window.__MAP = { HH: HH, hhOf: hhOf, jitter: jitter, exact: exact, PLACE: PLACE, map: map, render: render };
</script>
</body></html>
